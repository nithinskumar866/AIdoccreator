<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">

</head>
<body>

  <a class="skip" href="#view">Skip to content</a>
  <div class="shell">
    <aside class="side">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-book"/></svg></span>
        <span>DocuMentor</span>
      </a>
      <nav id="nav" aria-label="Main">
        <a href="#/" data-route="home"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg><span>Home</span></a>
        <a href="#/library" data-route="library"><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg><span>Library</span></a>
        <p class="nav-label">Tools</p>
        <a href="#/check" data-route="check"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg><span>Check homework</span></a>
        <a href="#/create" data-route="create"><svg class="icon" aria-hidden="true"><use href="#i-spark"/></svg><span>Create homework</span></a>
        <a href="#/notes" data-route="notes"><svg class="icon" aria-hidden="true"><use href="#i-notes"/></svg><span>Review notes</span></a>
        <a href="#/ask" data-route="ask"><svg class="icon" aria-hidden="true"><use href="#i-chat"/></svg><span>Ask</span></a>
        <p class="nav-label">Saved</p>
        <a href="#/history" data-route="history"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg><span>History</span></a>
      </nav>
      <div class="side-foot">
        <div class="model" id="model-status" title="The Gemini model in use"></div>
        <button class="btn ghost small" id="theme-toggle" type="button"></button>
      </div>
    </aside>
    <main id="view" tabindex="-1"></main>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
  <input type="file" id="file-input" multiple hidden accept=".docx,.pdf,.txt,.md">
</body>
</html>
