<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuMentor - AI Education Assistant</title>
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #6366f1;
            --secondary: #4f46e5;
            --accent: #10b981;
            --dark: #1e293b;
            --light: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: var(--light);
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            display: grid;
            grid-template-columns: 300px 1fr;
            height: 100vh;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
        }

        /* Left Panel */
        .sidebar {
            background: rgba(15, 23, 42, 0.9);
            padding: 2rem;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            height: 100vh;
            overflow-y: auto;
        }

        .upload-section {
            position: relative;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-bottom: 2rem;
            transition: transform 0.3s ease;
        }

        .upload-section:hover {
            transform: translateY(-3px);
        }

        .upload-card {
            position: relative;
            margin-bottom: 1.5rem;
            border: 2px dashed rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .upload-card:hover {
            border-color: var(--accent);
            background: rgba(16, 185, 129, 0.05);
        }

        .upload-btn {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: var(--primary);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            border: none;
            width: 100%;
        }

        .upload-btn:hover {
            background: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        /* Action Buttons */
        .action-buttons {
            display: grid;
            gap: 1rem;
            margin-top: 2rem;
        }

        .action-btn {
            padding: 1.2rem;
            border-radius: 8px;
            border: none;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            font-weight: 500;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        /* Main Content */
        .main-content {
            padding: 3rem;
            height: 100vh;
            overflow-y: auto;
            background: url('data:image/svg+xml,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.005" numOctaves="3"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.2"/></svg>');
        }

        .query-section {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.8);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        #query {
            width: 100%;
            padding: 1.2rem;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }

        #query:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        #ask-btn {
            background: linear-gradient(135deg, var(--accent), #059669);
            width: 100%;
            padding: 1.2rem;
            border-radius: 8px;
            border: none;
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #ask-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .response-section {
            margin-top: 2rem;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 16px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .ai-response-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .ai-response-header h3 {
            color: var(--accent);
            font-size: 1.5rem;
        }

        /* Loader Animation */
        .loader {
            display: none;
            text-align: center;
            padding: 2rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Customization Options */
        .custom-options {
            margin: 1.5rem 0;
            background: rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #custom-instructions {
            width: 100%;
            min-height: 100px;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            resize: vertical;
        }

        /* Download Links */
        .download-links {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .download-link {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 1rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            transition: all 0.3s ease;
        }

        .download-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        /* Floating Animation */
        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        .floating-icon {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Left Sidebar -->
        <div class="sidebar">
            <div class="upload-section">
                <h2 class="floating-icon"><i class="fas fa-cloud-upload-alt"></i> Upload Documents</h2>

                <div class="upload-card">
                    <label for="textbook" class="upload-btn">
                        <i class="fas fa-book-open"></i> Textbook
                    </label>
                    <input type="file" accept=".docx,.pdf" id="textbook" hidden>
                    <div class="file-name" id="textbook-name"></div>
                </div>

                <div class="upload-card">
                    <label for="notes" class="upload-btn">
                        <i class="fas fa-sticky-note"></i> Notes
                    </label>
                    <input type="file" accept=".docx,.pdf" id="notes" hidden>
                    <div class="file-name" id="notes-name"></div>
                </div>

                <div class="upload-card">
                    <label for="homework" class="upload-btn">
                        <i class="fas fa-file-code"></i> Homework (Optional)
                    </label>
                    <input type="file" id="homework" hidden>
                    <div class="file-name" id="homework-name"></div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="action-btn" id="check-btn">
                    <i class="fas fa-check-circle"></i> Check Homework
                </button>
                <button class="action-btn" id="create-btn">
                    <i class="fas fa-plus-circle"></i> Create Homework
                </button>
            </div>

            <div class="loader" id="process-loader">
                <div class="spinner"></div>
                <p id="loader-text">Analyzing Documents...</p>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="query-section">
                <div class="ai-response-header">
                    <i class="fas fa-robot" style="font-size: 2rem; color: var(--accent);"></i>
                    <h3>AI Document Assistant</h3>
                </div>

                <div class="custom-options">
                    <h4><i class="fas fa-cog"></i> Customization Options</h4>
                    <textarea id="custom-instructions"
                        placeholder="Example: 'Generate 5 algebra questions: 2 MCQs (1 mark each), 3 problem sums (5 marks each)...'"></textarea>
                    <button id="custom-generate-btn" class="action-btn" style="margin-top: 1rem;">
                        <i class="fas fa-magic"></i> Generate Custom Homework
                    </button>
                </div>

                <input type="text" id="query" placeholder="Ask anything or provide instructions...">

                <button id="ask-btn">
                    <i class="fas fa-paper-plane"></i> Process Request
                </button>
            </div>

            <div class="response-section">
                <div class="ai-response-header">
                    <i class="fas fa-comment-dots"></i>
                    <h3>AI Response</h3>
                </div>

                <div id="response-box">
                    <p id="response-text"></p>
                    <div class="download-links" id="download-links"></div>
                </div>

                <div class="loader" id="query-loader">
                    <div class="spinner"></div>
                    <p>Generating Magic...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            function updateFileName(inputId, nameId) {
                document.getElementById(inputId).addEventListener('change', function (e) {
                    document.getElementById(nameId).textContent = e.target.files[0].name;
                });
            }

            updateFileName('textbook', 'textbook-name');
            updateFileName('notes', 'notes-name');
            updateFileName('homework', 'homework-name');

            // Handle both check and create actions
            function handleAction(action) {
                const textbook = document.getElementById('textbook').files[0];
                const notes = document.getElementById('notes').files[0];
                const homework = document.getElementById('homework').files[0];

                if (!textbook || !notes) {
                    alert('Please upload at least the textbook and notes!');
                    return;
                }

                if (action === 'check' && !homework) {
                    alert('Please upload homework to check!');
                    return;
                }

                const formData = new FormData();
                formData.append('textbook', textbook);
                formData.append('notes', notes);
                if (homework) formData.append('homework', homework);

                const endpoint = action === 'check' ? '/check' : '/create';
                document.getElementById('loader-text').textContent =
                    action === 'check' ? 'Checking Homework...' : 'Creating Homework...';

                // Show loader
                document.getElementById('process-loader').style.display = 'block';
                document.querySelectorAll('.action-btn').forEach(btn => btn.disabled = true);

                fetch(endpoint, {
                    method: 'POST',
                    body: formData
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.error) {
                            alert(data.error);
                        } else {
                            const downloadHTML = `
                        <a href="${data.download_link}" class="download-link">
                            <i class="fas fa-file-download"></i> Download ${action === 'check' ? 'Corrected' : 'New'} Homework
                        </a>
                    `;
                            document.getElementById('download-links').innerHTML = downloadHTML;
                        }
                    })
                    .catch(error => console.error('Error:', error))
                    .finally(() => {
                        document.getElementById('process-loader').style.display = 'none';
                        document.querySelectorAll('.action-btn').forEach(btn => btn.disabled = false);
                    });
            }

            // Custom Homework Generation
            document.getElementById('custom-generate-btn').addEventListener('click', function () {
                const textbook = document.getElementById('textbook').files[0];
                const notes = document.getElementById('notes').files[0];
                const customInstructions = document.getElementById('custom-instructions').value.trim();

                if (!textbook || !notes) {
                    alert('Please upload the textbook and notes first!');
                    return;
                }

                if (!customInstructions) {
                    alert('Please enter your custom requirements!');
                    return;
                }

                const formData = new FormData();
                formData.append('textbook', textbook);
                formData.append('notes', notes);
                formData.append('custom_instructions', customInstructions);

                document.getElementById('loader-text').textContent = 'Generating Custom Homework...';
                document.getElementById('process-loader').style.display = 'block';
                this.disabled = true;

                fetch('/generate-custom', {
                    method: 'POST',
                    body: formData
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.error) {
                            alert(data.error);
                        } else {
                            const downloadHTML = `
                                <a href="${data.download_link}" class="download-link">
                                    <i class="fas fa-file-download"></i> Download Custom Homework
                                </a>
                            `;
                            document.getElementById('download-links').innerHTML = downloadHTML;
                        }
                    })
                    .catch(error => console.error('Error:', error))
                    .finally(() => {
                        document.getElementById('process-loader').style.display = 'none';
                        this.disabled = false;
                    });
            });

            // Event listeners for buttons
            document.getElementById('check-btn').addEventListener('click', () => handleAction('check'));
            document.getElementById('create-btn').addEventListener('click', () => handleAction('create'));

            // Ask question functionality
            // Modify the ask-btn event listener:
            // Modify the ask-btn event listener in index.html:
            document.getElementById('ask-btn').addEventListener('click', function () {
                const question = document.getElementById('query').value.trim();
                if (!question) {
                    alert('Please enter a question!');
                    return;
                }

                const textbook = document.getElementById('textbook').files[0];
                const notes = document.getElementById('notes').files[0];

                if (!textbook || !notes) {
                    alert('Please upload both textbook and notes first!');
                    return;
                }

                document.getElementById('query-loader').style.display = 'block';
                this.disabled = true;

                const formData = new FormData();
                formData.append('textbook', textbook);
                formData.append('notes', notes);
                formData.append('prompt', question);

                fetch('/prompt', {
                    method: 'POST',
                    body: formData
                })
                    .then(response => {
                        if (!response.ok) throw new Error('Server error');
                        return response.json();
                    })
                    .then(data => {
                        if (data.error) throw new Error(data.error);
                        document.getElementById('response-text').textContent = data.response;
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert(`Error: ${error.message || 'Processing failed'}`);
                    })
                    .finally(() => {
                        document.getElementById('query-loader').style.display = 'none';
                        this.disabled = false;
                    });
            });




        });
    </script>
</body>

</html>
